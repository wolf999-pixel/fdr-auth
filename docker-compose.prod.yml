version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fdr_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fdr_qrauth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Andre1234}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fdr_qrauth']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fdr_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Andre1234}@postgres:5432/${POSTGRES_DB:-fdr_qrauth}
      JWT_SECRET: ${JWT_SECRET:-devsecret-change-me}
      JWT_EXPIRES_IN: 24h
      UPLOADS_DIR: /app/uploads
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fdr_frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
