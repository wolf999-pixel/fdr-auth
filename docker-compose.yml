version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fdr-auth-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - PUBLIC_APP_URL=http://localhost:5173
      - JWT_SECRET=your-secret-key-change-in-production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fdr_auth
    depends_on:
      - postgres
    networks:
      - fdr-network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fdr-auth-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api
    depends_on:
      - backend
    networks:
      - fdr-network

  postgres:
    image: postgres:15-alpine
    container_name: fdr-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fdr_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fdr-network

networks:
  fdr-network:
    driver: bridge

volumes:
  postgres_data:
